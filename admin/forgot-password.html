<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Reset password — InKozi Admin</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap"><div class="auth-card">
  <div class="logo"><img src="assets/images/logo.png" alt="InKozi"><span class="env">Admin console</span></div>
  <h1>Reset your password</h1><p class="sub">Enter your work email. If it belongs to a staff account we will send a reset link that expires in 15 minutes.</p>
  <form data-demo="login.html">
    <div class="fld"><label for="f-email">Work email</label><div class="with-icon"><i class="bi bi-envelope"></i><input class="form-control" id="f-email" type="email" placeholder="you@inkozi.com" required></div></div>
    <button class="btn-brand w-100">Send reset link <i class="bi bi-arrow-right"></i></button>
  </form>
  <a href="login.html" class="btn-outline w-100 mt-3"><i class="bi bi-arrow-left"></i> Back to sign in</a>
  <div class="auth-foot">Locked out? Ask another super admin to reset it from <strong>Staff &amp; roles</strong>.</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/admin.js"></script>
</body>
</html>

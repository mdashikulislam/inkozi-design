<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sign in — InKozi Admin</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap"><div class="auth-card">
  <div class="logo"><img src="assets/images/logo.png" alt="InKozi"><span class="env">Admin console</span></div>
  <h1>Sign in</h1><p class="sub">Restricted to InKozi staff. Every sign-in is logged.</p>
  <form data-demo="index.html">
    <div class="fld"><label for="l-email">Work email</label><div class="with-icon"><i class="bi bi-envelope"></i><input class="form-control" id="l-email" type="email" placeholder="you@inkozi.com" autocomplete="username" required></div></div>
    <div class="fld"><label for="l-pass">Password <a href="forgot-password.html" style="font-weight:600;font-size:12.5px">Forgot?</a></label><div class="pw-wrap"><input class="form-control" id="l-pass" type="password" placeholder="Your password" autocomplete="current-password" required><button type="button" class="pw-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
    <div class="fld"><label>Authenticator code <small>6 digits</small></label><div class="otp"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5"><input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6"></div></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="l-trust"><label class="form-check-label" for="l-trust">Trust this device for 30 days</label></div>
    <button class="btn-brand w-100">Sign in <i class="bi bi-arrow-right"></i></button>
  </form>
  <div class="or">or</div>
  <button class="btn-outline w-100"><i class="bi bi-google"></i> Continue with Google Workspace</button>
  <div class="auth-foot">&copy; 2024 InKozi, Inc. <a href="../frontend/privacy-policy.html">Privacy</a> · <a href="../frontend/terms-of-use.html">Terms</a> · <a href="../frontend/index.html">Public site</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/admin.js"></script>
</body>
</html>
